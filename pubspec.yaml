name: biogas_service_app
description: A digital service delivery platform for Grid, Solar, and Biogas solutions
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  
  # Local Database (Offline)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Cloud Database & Auth (Online) — FlutterFire 3.x for Dart 3.5+ / web (fixes firebase_storage_web dartify/jsify)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.6
  
  # Navigation
  go_router: ^13.0.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Network & Sync
  connectivity_plus: ^5.0.2
  http: ^1.1.2
  
  # Notifications (simplified - in-app only for MVP)
  # firebase_messaging: ^14.7.9  # Keep commented for future use
  
  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  
  # Responsive Design
  flutter_screenutil: ^5.9.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  pdf: ^3.10.5
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/logo/
    - assets/config/

